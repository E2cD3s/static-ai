<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1360" height="480" viewBox="0 0 1360 480">
  <defs>
    <radialGradient id="bg" cx="62%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2b1150"/>
      <stop offset="0.55" stop-color="#110725"/>
      <stop offset="1" stop-color="#05030b"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="vignette" cx="55%" cy="50%" r="80%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.8"/>
    </radialGradient>

    <filter id="static" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 0.17"/>
    </filter>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="3" fill="#000" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <text id="word" x="800" y="262" text-anchor="middle" font-family="Bahnschrift, 'Arial Black', Impact, sans-serif"
          font-weight="700" font-size="164" letter-spacing="22" fill="currentColor">STATIC</text>

    <clipPath id="slice1"><rect x="0" y="176" width="1360" height="16"/></clipPath>
    <clipPath id="slice2"><rect x="0" y="228" width="1360" height="12"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1360" height="480" fill="url(#bg)"/>
  <rect width="1360" height="480" filter="url(#static)"/>

