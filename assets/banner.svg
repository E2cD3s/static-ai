  <rect x="0" y="239" width="1360" height="2" fill="url(#wave)" opacity="0.55" filter="url(#softglow)"/>

  <!-- wordmark with chromatic aberration -->
  <use href="#word" xlink:href="#word" transform="translate(-8,0)" style="color:#00e5ff; mix-blend-mode:screen" opacity="0.9"/>
  <use href="#word" xlink:href="#word" transform="translate(8,0)" style="color:#ff2bd6; mix-blend-mode:screen" opacity="0.9"/>
  <use href="#word" xlink:href="#word" style="color:#effcff" filter="url(#glow)"/>
  <g clip-path="url(#slice1)"><use href="#word" xlink:href="#word" transform="translate(26,0)" style="color:#ff2bd6"/></g>
  <g clip-path="url(#slice2)"><use href="#word" xlink:href="#word" transform="translate(-30,0)" style="color:#00e5ff"/></g>

  <!-- taglines -->
  <text x="800" y="322" text-anchor="middle" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="600"
        font-size="30" letter-spacing="9" fill="#bff4ff" opacity="0.92" filter="url(#softglow)">THE VOICE IN YOUR VOICE CHAT</text>
  <text x="800" y="366" text-anchor="middle" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="500"
        font-size="20" letter-spacing="7" fill="#ff7be3" opacity="0.85">NO CLOUD · NO FILTER · NO CHILL</text>

  <!-- ON AIR badge -->
  <g transform="translate(1178,34)" filter="url(#softglow)">
    <rect x="0" y="0" width="148" height="44" rx="22" fill="#1a0610" fill-opacity="0.6" stroke="#ff3b5c" stroke-width="2.5"/>
    <circle cx="26" cy="22" r="8" fill="#ff3b5c"/>
    <text x="44" y="30" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="700" font-size="22"
          letter-spacing="4" fill="#ff6b84">ON AIR</text>
  </g>

  <!-- glitch artifacts -->
  <rect x="470" y="150" width="120" height="5" fill="#00e5ff" opacity="0.8"/>
  <rect x="1010" y="286" width="140" height="5" fill="#ff2bd6" opacity="0.8"/>
