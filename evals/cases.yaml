# Replay test set for `python -m voicebot.replay` (kinds and fields: see voicebot/replay.py).
# Add a case whenever the bot gets something wrong in a call - it keeps the fix from quietly regressing.

# ---------------------------------------------------------------- is a follow-up line for the bot?
- id: addr-all-right
  kind: addressee
  recent: ["alex: Clip that. Clip that.", "Static: Ha, fair. A solid little chunk of chaos right there."]
  speaker: alex
  line: All right.
  for_me: false
- id: addr-lets-hear-it
  kind: addressee
  recent: ["Static: Ha, fair. A solid little chunk of chaos right there.", "alex: All right."]
  speaker: alex
  line: We got it. We got it. Let's hear it.
  for_me: false
- id: addr-pushback-roast
  kind: addressee
  recent: ["alex: No, you roast him.", "Static: jordan, you're predictable, like a perfectly placed piece of decorative wiring.", "sam_plays: I'll take that as a compliment."]
  speaker: alex
  line: How's that a roast? Bitch, you're stupid.
  for_me: true
- id: addr-about-her-to-friend
  kind: addressee
  recent: ["Static: So you're saying built-in is synonymous with aesthetic confidence?", "Static: nah, I'm saying you're boringly perfect.", "jordan_x: What?"]
  speaker: alex
  line: Okay, is she making fun of you or is she raising you up still?
  for_me: false
- id: addr-followup-question
  kind: addressee
  recent: ["alex: Static, what's the best weapon in Minecraft?", "Static: Netherite sword, obviously. Keep up."]
  speaker: alex
  line: What about a mace though?
  for_me: true
- id: addr-disagree
  kind: addressee
  recent: ["alex: Static, what's the best weapon in Minecraft?", "Static: Netherite sword, obviously. Keep up."]
  speaker: alex
  line: Nah, you're wrong, the mace clears.
  for_me: true
- id: addr-game-callout
  kind: addressee
  recent: ["alex: Static, what's the best weapon in Minecraft?", "Static: Netherite sword, obviously. Keep up."]
  speaker: alex
  line: Dude, go left, there's a creeper behind you.
  for_me: false
- id: addr-react-to-joke
  kind: addressee
  recent: ["alex: Static, tell me a joke.", "Static: Your K/D ratio. That's the joke."]
  speaker: alex
  line: Oh my god, that's brutal.
  for_me: true
- id: addr-grab-drink
  kind: addressee
  recent: ["alex: Static, what time is it?", "Static: Almost one. Go to bed."]
  speaker: alex
  line: Hang on, I need to grab a drink.
  for_me: false
- id: addr-what-can-you-do
  kind: addressee
  recent: ["alex: Static, who made you?", "Static: d3s built me. Obviously."]
  speaker: alex
  line: And what can you do?
  for_me: true
- id: addr-names-friend
  kind: addressee
  recent: ["alex: Static, who made you?", "Static: d3s built me. Obviously."]
  speaker: alex
  line: Sam, did you hear that?
  people: [alex, sam_plays, jordan_x]
  for_me: false

