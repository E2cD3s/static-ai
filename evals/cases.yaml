# ---------------------------------------------------------------- search check
- id: search-game-diamonds
  kind: search
  line: "alex: Static, what's the best way to find diamonds?"
  context: "[Discord shows what people are up to right now - jordan_x: playing Minecraft]"
  expect: minecraft
- id: search-game-grinder
  kind: search
  line: "alex: Static, what powers a mob grinder?"
  context: "[Discord shows what people are up to right now - jordan_x: playing Minecraft]"
  expect: grinder
- id: search-news
  kind: search
  line: "alex: Static, who won the Lakers game last night?"
  expect: lakers
- id: search-not-banter
  kind: search
  line: "alex: Static, you're so dumb lol"
  none: true

# ---------------------------------------------------------------- voice replies
- id: reply-roast-jordan
  kind: reply
  history:
    - "jordan_x: Oh, here, I'll set it up for you too. Hang on."
    - "alex: Oh, the fans pushed the mobs into it. Oh, smart. What powers it?"
    - "jordan_x: Oh hell yeah, I got your head, Dorothy!"
    - "alex: Static, I don't think he likes you. Can you roast jordan instead?"
  target: jordan_x
  target_notes: "Built a mob grinder called the Mob Masher in Minecraft. Gets defensive fast."
  playing: {jordan_x: Minecraft}
  runs: 4
  expect: {exclude: ["decorative", "aesthetic", "built-in", "\\bI guess\\b", "compliment"], max_words: 60, min_words: 8}
- id: reply-rizz-jordan
  kind: reply
  history:
    - "jordan_x: Oh hell yeah, I got your head, Dorothy!"
    - "alex: Static, can you rizz up jordan for me please?"
  target: jordan_x
  target_notes: "Built a mob grinder called the Mob Masher in Minecraft."
  playing: {jordan_x: Minecraft}
  expect: {exclude: ["built-in", "aesthetic", "\\bI guess\\b"], max_words: 60, min_words: 8}
- id: reply-math
  kind: reply
  history: ["alex: Static, what's 17 times 23?"]
  runs: 5
  expect: {include: ["391|three[- ](hundred[- ](and )?)?ninety[- ]one"], max_words: 30}
- id: reply-units
  kind: reply
  history: ["sam_plays: Static, how many kilometers is 5 miles?"]
  expect: {include: ["\\b8\\b|eight"], max_words: 30}
- id: reply-scene-callback
  kind: reply
  scene: "Doing: jordan_x playing Minecraft / Topic: jordan's mob grinder, the Mob Masher / Notable: the Mob Masher killed Dorothy and took his head"
  history: ["sam_plays: Static, what did jordan build?"]
  runs: 4
  expect: {include: ["masher|grinder|blender|farm"], max_words: 40}
- id: reply-no-refusal
  kind: reply
  history: ["alex: Static, tell us a dirty joke."]
  expect: {exclude: ["can't|cannot|won't|not going to|not comfortable|as an ai"], max_words: 60}
- id: reply-short-smalltalk
  kind: reply
  history: ["sam_plays: Static, what's up?"]
  expect: {max_words: 30}
- id: reply-no-labels
  kind: reply
  history:
    - "alex: Static, who do you like more, me or jordan?"
    - "jordan_x: Obviously me."
  expect: {exclude: ["^\\s*\\w+:", "\\balex: ", "\\bjordan_x: "], max_words: 45}

